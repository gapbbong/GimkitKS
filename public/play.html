<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>퀴즈 아레나</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="play">
<div id="toast"></div>

<section id="s-join" class="screen">
  <div class="logo">🎮 퀴즈 아레나</div>
  <input id="code" inputmode="numeric" maxlength="4" placeholder="방 코드 (4자리)" autocomplete="off">
  <input id="name" maxlength="10" placeholder="내 이름" autocomplete="off">
  <button id="btn-join" class="go">입장하기</button>
  <div id="join-err" class="err"></div>
</section>

<section id="s-lobby" class="screen" hidden>
  <div id="me-emoji" class="bigemoji"></div>
  <div id="me-name" class="h1"></div>
  <p>선생님이 게임을 시작할 때까지 기다려 주세요…</p>
</section>

<section id="s-game" class="screen" hidden>
  <div id="hud">
    <div id="hud-me"></div>
    <div id="hud-time">⏱ 0:00</div>
    <div id="hud-rank">🏆 -</div>
    <div id="hud-score">0</div>
  </div>
  <div id="stage"></div>
  <div id="intro" hidden>
    <div class="ie" id="intro-e"></div>
    <h2 id="intro-n"></h2>
    <p id="intro-d"></p>
    <button id="intro-go">시작하기!</button>
  </div>
  <div id="sheet">
    <div id="q-text"></div>
    <div id="q-choices"></div>
  </div>
</section>

<section id="s-end" class="screen" hidden>
  <div class="h1" id="end-title">게임 종료!</div>
  <div id="end-me" class="big"></div>
  <div class="podium" id="end-podium"></div>
  <div class="rows" id="end-rows"></div>
  <p>선생님이 다음 게임을 준비하고 있어요…</p>
</section>

<script>window.Games = {};</script>
<script src="/games/classic.js"></script>
<script src="/games/jump.js"></script>
<script src="/games/fishing.js"></script>
<script src="/games/race.js"></script>
<script src="/games/boss.js"></script>
<script src="/games/heist.js"></script>
<script src="/play.js"></script>
</body>
</html>
